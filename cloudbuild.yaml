steps:
  - name: node:24-bookworm-slim
    entrypoint: node
    args:
      - --test
      - test/companion-chat.test.mjs
      - test/companion-motion.test.mjs
      - test/server.test.mjs
      - test/komugi-chat.test.mjs
      - test/komugi-conversation.test.mjs
      - test/progress.test.mjs
      - test/admin-auth.test.mjs
      - test/admin-usage.test.mjs
      - test/account-api.test.mjs
      - test/owner-memory.test.mjs
      - test/account-client.test.mjs
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_IMAGE_URI}:${_RELEASE_TAG}
      - .
images:
  - ${_IMAGE_URI}:${_RELEASE_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
