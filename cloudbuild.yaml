steps:
  - name: node:24-bookworm-slim
    entrypoint: bash
    args:
      - -c
      - node --test test/*.test.mjs
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_IMAGE_URI}:${_RELEASE_TAG}
      - .
images:
  - ${_IMAGE_URI}:${_RELEASE_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
